<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Armor -->
  <path d="M24 3 L41 9 V22 C41 33.5 33.8 42.2 24 45 C14.2 42.2 7 33.5 7 22 V9 L24 3 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner Cyber Lattice Facet Lines -->
  <path d="M24 8 L36 12.5 V21 C36 29.5 30.5 36.5 24 39 C17.5 36.5 12 29.5 12 21 V12.5 L24 8 Z" 
        stroke="#10b981" 
        stroke-opacity="0.35" 
        stroke-width="1.2" 
        stroke-dasharray="2 2"
        fill="none" />

  <!-- Center Geometric Defense Node -->
  <polygon points="24,15 31,19 31,27 24,31 17,27 17,19" 
           fill="#064e3b" 
           stroke="url(#coreGrad)" 
           stroke-width="1.8" />

  <!-- Center Core Pulse -->
  <circle cx="24" cy="23" r="3.2" fill="#34d399" />
  <circle cx="24" cy="23" r="1.5" fill="#ffffff" />

  <!-- Top Micro-Accent (Sovereign Tricolor subtle dot) -->
  <circle cx="24" cy="5.5" r="1" fill="#f97316" />
</svg>
